version: '3.8'

services:
  mock-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mock-api-golang:latest
    container_name: mock-api
    # NOT: Caddy 'saas_default' ağı içinden doğrudan 'mock-api:8080' ile
    # iletişim kuracağı için sunucuda port çakışması olmaması adına
    # dışarıya (host / 0.0.0.0) herhangi bir port açmaya gerek yoktur.
    environment:
      - PORT=8080
    restart: unless-stopped
    networks:
      - saas_net

networks:
  saas_net:
    external: true
    name: saas_default
